name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          AAC596: ${{ secrets.AAC596 }}
          BF9DF3: ${{ secrets.BF9DF3 }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('AAC596', '')
          meta_b = os.environ.get('BF9DF3', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- e3461a99bbcb4597251ad2cd55943956 -->', meta_a)
          if meta_b:
              out = out.replace('<!-- a5d999d1485525b634aab77f34896f78450d773096e6 -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
